<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Favicon fictício do Hora Âmbar: sol âmbar sobre índigo. O SVG do favicon é um
       documento à parte e não enxerga as variáveis CSS: as cores repetem os primitivos
       indigo-700 (#33388c) e amber-400 (#f2aa3a) do tokens.css. Comentário de XML não
       aceita dois hifens seguidos, por isso os nomes vão sem eles -->
  <rect width="32" height="32" rx="7" fill="#33388c" />
  <circle cx="16" cy="16" r="6.5" fill="#f2aa3a" />
  <path
    stroke="#f2aa3a"
    stroke-width="2"
    stroke-linecap="round"
    d="M16 3.5v2.5M16 26v2.5M3.5 16H6M26 16h2.5M7.2 7.2l1.8 1.8M23 23l1.8 1.8M7.2 24.8 9 23M23 9l1.8-1.8"
  />
</svg>
